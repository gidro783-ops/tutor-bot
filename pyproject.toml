[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "venv",
    ".venv",
]

[tool.ruff.lint]
# Минимальный безопасный набор: синтаксические ошибки (E9) и обращения
# к несуществующим именам (F82x). CI не «падает» по мелочам, но реальные
# баги ловит. Готовы к строгости — расширяйте: select = ["E", "F", "W", "I", "UP"]
select = ["E9", "F821", "F822", "F823"]

[tool.pytest.ini_options]
testpaths = ["tests"]
