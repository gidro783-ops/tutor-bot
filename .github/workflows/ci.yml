name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Pytest + smoke (логика БД, безопасность, напоминания)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pytest гоняет реальную логику на SQLite — нужны зависимости.
      # Смоук-тест шимами не пользуется и работает в той же среде.
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      - run: python tests/smoke_test.py

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff==0.6.9
      - run: ruff check .
