# Railway: Nixpacks build (Python is auto-detected from
# requirements.txt + .python-version), start command and healthcheck.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python main.py"
# main.py already runs an HTTP server: GET /health -> "OK" (binds $PORT)
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
